# Playwright left CI on 2026-09-18 (Luis): it stalled and cost minutes per push; run `pnpm test:e2e` by hand.
name: CI

on:
  push:
    branches: [master, refactor]
  pull_request:

jobs:
  quality:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Typecheck
        run: npx tsc -b

      - name: Lint
        run: pnpm lint

      - name: Build
        run: pnpm build

      - name: Unit test coverage
        run: pnpm test:coverage
